<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#17232b"><title>予約管理｜東運整備サイト試作</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/forms.css"></head><body><div class="demo-note">非公式サイト試作 · 所有者用管理画面</div><header class="site-header"><div class="wrap header-inner"><a class="brand" href="/"><span class="brand-mark">T<span>+</span></span><span class="brand-name">東運整備<small>TOUN SEIBI</small></span></a><nav aria-label="管理メニュー"><a href="/">サイトを見る</a><a href="/reserve">予約希望フォーム</a></nav></div></header><main class="admin-main"><div class="wrap"><div class="admin-heading"><div><p class="eyebrow">RESERVATION DESK</p><h1>予約管理</h1><p>予約希望の確認、対応状況、運営メモを管理します。</p></div><button id="refresh-button" class="outline-button" type="button">更新 ↻</button></div><div class="admin-notice">この画面はサイト所有者のみ閲覧できます。フォーム送信だけでは予約は確定しません。実際の店舗への通知は行われません。</div><div id="summary" class="summary-grid" aria-label="予約状況"></div><div class="admin-toolbar"><label for="status-filter">表示</label><select id="status-filter"><option value="all">すべて</option><option value="new">新規</option><option value="contacted">連絡済み</option><option value="confirmed">確定</option><option value="completed">完了</option><option value="declined">見送り</option></select><span id="result-count"></span></div><p id="admin-message" class="form-message" role="status" aria-live="polite"></p><div id="reservations" class="reservation-list"></div></div></main><footer><div class="wrap footer-bottom"><span>非公式サイト試作・予約管理</span><a href="/">サイトを見る</a></div></footer><script src="/admin.js" defer></script></body></html>
